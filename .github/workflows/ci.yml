name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS and hassfest change underneath us; catch it before a release does.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Check Vite+ catalog is in sync
        run: node scripts/check-vite-plus-sync.mjs

      - name: No runtime dependencies
        run: node -e "const d=require('./package.json').dependencies||{};if(Object.keys(d).length){console.error('Runtime dependencies are not allowed:',d);process.exit(1)}"

      - name: Format, lint and type-check
        run: pnpm exec vp check

      - name: Unit tests
        run: pnpm test

      - name: Example plan fixture and preview are reproducible
        run: |
          pnpm example-plan
          if [ -n "$(git status --porcelain frontend/test/fixtures docs/images)" ]; then
            git status --porcelain frontend/test/fixtures docs/images
            echo '::error::Example plan is out of date. Run `pnpm example-plan` and commit it.'
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Built frontend is committed
        run: |
          if [ -n "$(git status --porcelain custom_components/chartroom/frontend)" ]; then
            git status --porcelain custom_components/chartroom/frontend
            echo '::error::custom_components/chartroom/frontend is out of date. Run `pnpm build` and commit it.'
            exit 1
          fi

      - name: Bundle size budget
        run: pnpm size

  python:
    name: Python (${{ matrix.ha }} HA)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # uv.lock: the newest Home Assistant pytest-homeassistant-custom-component supports.
          - ha: latest
          # hacs.json's minimum, installed over the locked environment. Each
          # pytest-homeassistant-custom-component release pins one Home Assistant release, and
          # home-assistant-frontend must be the one that release pins (its package_constraints.txt).
          # Move these with hacs.json; the version check below fails until they match.
          - ha: minimum
            phcc: '0.13.371'
            frontend: '20260930.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --group lint --no-install-project

      - name: Install the minimum Home Assistant
        if: matrix.ha == 'minimum'
        env:
          PHCC: ${{ matrix.phcc }}
          FRONTEND: ${{ matrix.frontend }}
        run: |
          uv pip install --python .venv \
            "pytest-homeassistant-custom-component==$PHCC" "home-assistant-frontend==$FRONTEND"

      - name: Home Assistant is hacs.json's minimum
        if: matrix.ha == 'minimum'
        run: |
          uv run --no-sync python - <<'PY'
          import json

          from homeassistant.const import __version__

          minimum = json.load(open("hacs.json"))["homeassistant"]
          print(f"Home Assistant {__version__}, hacs.json minimum {minimum}")
          if __version__ != minimum:
              print(f"::error::Home Assistant {__version__} is not hacs.json's minimum {minimum}")
              raise SystemExit(1)
          PY

      - name: Ruff lint
        if: matrix.ha == 'latest'
        run: uv run --no-sync ruff check --output-format github .

      - name: Ruff format
        if: matrix.ha == 'latest'
        run: uv run --no-sync ruff format --check .

      - name: Tests (pytest-homeassistant-custom-component)
        run: uv run --no-sync pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The HACS action can only validate public repositories. Until the repository goes public
      # at release this job only records that; afterwards validation runs with no change here.
      - name: Repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" = true ]; then
            echo '::notice::Repository is private; HACS validation is skipped until it is public.'
          fi

      - name: HACS validation
        if: steps.repo.outputs.private == 'false'
        uses: hacs/action@22.5.0
        with:
          category: integration
          comment: false
          # Brand assets go to home-assistant/brands at release (Phase 6).
          ignore: brands

  e2e:
    name: End-to-end (${{ matrix.ha }} HA)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # latest: uv.lock's Home Assistant (moves with Dependabot's Python updates).
        # minimum: hacs.json's.
        ha: [latest, minimum]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Start Home Assistant with Chartroom
        env:
          HA: ${{ matrix.ha }}
        run: |
          if [ "$HA" = minimum ]; then
            tag=$(jq -r .homeassistant hacs.json)
          else
            tag=$(python3 -c 'import sys, tomllib; sys.stdout.write(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "homeassistant"))')
          fi
          if [ -z "$tag" ] || [ "$tag" = null ]; then
            echo "::error::No Home Assistant version for the $HA run"
            exit 1
          fi
          echo "Home Assistant $tag"
          mkdir -p .ci/ha-config/custom_components
          cp .ci/configuration.yaml .ci/ha-config/
          cp -r custom_components/chartroom .ci/ha-config/custom_components/
          docker run -d --name ha -p 127.0.0.1:8123:8123 -e TZ=Europe/Copenhagen -e CHARTROOM_TEST_HOOKS=1 \
            -v "$PWD/.ci/ha-config:/config" \
            "ghcr.io/home-assistant/home-assistant:${tag}"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests
        run: pnpm e2e
        env:
          HA_URL: http://127.0.0.1:8123

      - name: Home Assistant log
        if: always()
        run: docker logs ha 2>&1 | tail -200

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.ha }}-ha
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single required status check for the main ruleset (mirrors captains-chest/floor-planner).
  # A matrix job's result is success only if every entry succeeded.
  ci:
    name: CI
    if: always()
    needs: [frontend, python, hassfest, hacs, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
