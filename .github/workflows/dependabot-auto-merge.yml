name: Dependabot auto-merge

# Turns on GitHub auto-merge (squash) for Dependabot PRs. The PR merges only once the
# required CI checks in the branch ruleset pass; a red build blocks it. Without a ruleset that
# requires checks, `--auto` merges at once; the private repo on the free plan cannot have one, so
# the job only runs on a public repository. Major-version bumps are never auto-merged.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # Major bumps always wait for a human.
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
