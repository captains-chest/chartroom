# Home Assistant config for the CI end-to-end job (copied into a fresh config dir).
default_config:

logger:
  default: warning
  logs:
    custom_components.chartroom: debug

# Sensors the editor's source tool offers and the heatmap reads (the example plan has them
# placed). Backed by input numbers so the tests can change a reading. The e2e setup puts them in
# areas.
template:
  - sensor:
      - name: Living room temperature
        unique_id: e2e_living_room_temperature
        state: "{{ states('input_number.living_room_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Living room humidity
        unique_id: e2e_living_room_humidity
        state: "{{ states('input_number.living_room_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      - name: Kitchen temperature
        unique_id: e2e_kitchen_temperature
        state: "{{ states('input_number.kitchen_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Kitchen humidity
        unique_id: e2e_kitchen_humidity
        state: "{{ states('input_number.kitchen_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      - name: Bedroom temperature
        unique_id: e2e_bedroom_temperature
        state: "{{ states('input_number.bedroom_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Bedroom humidity
        unique_id: e2e_bedroom_humidity
        state: "{{ states('input_number.bedroom_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      - name: Bath temperature
        unique_id: e2e_bath_temperature
        state: "{{ states('input_number.bath_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Bath humidity
        unique_id: e2e_bath_humidity
        state: "{{ states('input_number.bath_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      - name: Hall temperature
        unique_id: e2e_hall_temperature
        state: "{{ states('input_number.hall_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Hall humidity
        unique_id: e2e_hall_humidity
        state: "{{ states('input_number.hall_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      - name: Office temperature
        unique_id: e2e_office_temperature
        state: "{{ states('input_number.office_temp') | float(0) | round(1) }}"
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Office humidity
        unique_id: e2e_office_humidity
        state: "{{ states('input_number.office_hum') | float(0) | round(0) }}"
        unit_of_measurement: '%'
        device_class: humidity
        state_class: measurement
      # A sensor with a flat battery: unavailable, so the heatmap leaves it out.
      - name: Bath temperature 2 dead battery
        unique_id: e2e_bath_temperature_2_dead_battery
        state: '0'
        availability: '{{ false }}'
        unit_of_measurement: '°C'
        device_class: temperature
        state_class: measurement
      - name: Hall sensor RSSI
        unique_id: e2e_hall_sensor_rssi
        state: '-52'
        unit_of_measurement: 'dBm'
        device_class: signal_strength
        state_class: measurement
  - light:
      # Dimmable, so the device menu offers Brightness.
      - name: Kitchen ceiling light
        unique_id: e2e_kitchen_ceiling_light
        state: "{{ is_state('input_boolean.kitchen_light', 'on') }}"
        level: "{{ states('input_number.kitchen_light_level') | int(0) }}"
        set_level:
          - action: input_number.set_value
            target: { entity_id: input_number.kitchen_light_level }
            data: { value: '{{ brightness }}' }
        turn_on:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.kitchen_light }
        turn_off:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.kitchen_light }
      - name: Living room ceiling light
        unique_id: e2e_living_room_ceiling_light
        state: "{{ is_state('input_boolean.living_room_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.living_room_light }
        turn_off:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.living_room_light }
      - name: Kitchen pendant unreachable
        unique_id: e2e_kitchen_pendant_unreachable
        state: '{{ false }}'
        availability: '{{ false }}'
        turn_on: []
        turn_off: []
  - switch:
      - name: Coffee maker
        unique_id: e2e_coffee_maker
        state: "{{ is_state('input_boolean.coffee_maker', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.coffee_maker }
        turn_off:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.coffee_maker }
  - binary_sensor:
      - name: Front door
        unique_id: e2e_front_door
        device_class: door
        state: "{{ is_state('input_boolean.front_door', 'on') }}"
      - name: Kitchen window
        unique_id: e2e_kitchen_window
        device_class: window
        state: "{{ is_state('input_boolean.kitchen_window', 'on') }}"
      - name: Hall motion
        unique_id: e2e_hall_motion
        device_class: motion
        state: "{{ is_state('input_boolean.hall_motion', 'on') }}"
  - lock:
      - name: Front door lock
        unique_id: e2e_front_door_lock
        state: "{{ 'locked' if is_state('input_boolean.front_door_lock', 'on') else 'unlocked' }}"
        lock:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.front_door_lock }
        unlock:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.front_door_lock }
  - cover:
      - name: Living room blind
        unique_id: e2e_living_room_blind
        device_class: blind
        state: "{{ 'open' if is_state('input_boolean.living_room_blind', 'on') else 'closed' }}"
        open_cover:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.living_room_blind }
        close_cover:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.living_room_blind }

# Devices for the marker tests, named like the developer instance's simulated ones. Template
# entities backed by input booleans, so turning them on and off really changes state.
input_boolean:
  kitchen_light:
    name: Kitchen light (sim)
    initial: false
  living_room_light:
    name: Living room light (sim)
    initial: true
  coffee_maker:
    name: Coffee maker (sim)
    initial: false
  front_door:
    name: Front door (sim)
    initial: false
  kitchen_window:
    name: Kitchen window (sim)
    initial: true
  hall_motion:
    name: Hall motion (sim)
    initial: false
  front_door_lock:
    name: Front door lock (sim)
    initial: true
  living_room_blind:
    name: Living room blind (sim)
    initial: false

# Readings behind the climate sensors, like the developer instance's simulated ones.
input_number:
  kitchen_light_level:
    name: Kitchen light level (sim)
    min: 0
    max: 255
    step: 1
    initial: 255
  living_room_temp:
    name: Living room temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 22.4
  living_room_hum:
    name: Living room hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 45
  kitchen_temp:
    name: Kitchen temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 21.5
  kitchen_hum:
    name: Kitchen hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 48
  bedroom_temp:
    name: Bedroom temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 19.0
  bedroom_hum:
    name: Bedroom hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 52
  bath_temp:
    name: Bath temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 23.5
  bath_hum:
    name: Bath hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 68
  hall_temp:
    name: Hall temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 20.2
  hall_hum:
    name: Hall hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 50
  office_temp:
    name: Office temp (sim)
    min: 10
    max: 32
    step: 0.1
    initial: 21.0
  office_hum:
    name: Office hum (sim)
    min: 0
    max: 100
    step: 1
    initial: 40
