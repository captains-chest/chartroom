[project]
name = "chartroom"
version = "0.2.0"
description = "Chartroom: a floor plan view for Home Assistant"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.375",
  # panel_custom depends on frontend, which needs the frontend package (pinned by HA core).
  "home-assistant-frontend==20261028.6",
]
lint = ["ruff==0.17.5"]

[tool.uv]
# Pillow 12.3.0, which Home Assistant pins, has security advisories fixed in 13.0.0 (#73). It is
# only in the test environment, through pytest-homeassistant-custom-component. Remove this once a
# pytest-homeassistant-custom-component release pins Home Assistant with Pillow >= 13.0.0.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# Deprecated calls Chartroom makes fail the test that makes them. The module is a regex matched
# against the module the warning is attributed to (the caller, for warnings raised with
# stacklevel=2 as Home Assistant and the standard library do), so warnings from inside other
# libraries still only show in the summary.
filterwarnings = ["error::DeprecationWarning:custom_components\\.chartroom"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["node_modules", "custom_components/chartroom/frontend"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "FLY",
  "I",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TID",
  "UP",
  "W",
]
ignore = [
  "D203", # one-blank-line-before-class conflicts with D211
  "D213", # multi-line-summary-second-line conflicts with D212
  "PLR2004", # magic values in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.chartroom"]
combine-as-imports = true
