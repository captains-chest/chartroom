name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS and hassfest change underneath us; catch it before a release does.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HA_VERSION: '2026.10.3'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Check Vite+ catalog is in sync
        run: node scripts/check-vite-plus-sync.mjs

      - name: No runtime dependencies
        run: node -e "const d=require('./package.json').dependencies||{};if(Object.keys(d).length){console.error('Runtime dependencies are not allowed:',d);process.exit(1)}"

      - name: Format, lint and type-check
        run: pnpm exec vp check

      - name: Unit tests
        run: pnpm test

      - name: Example plan fixture and preview are reproducible
        run: |
          pnpm example-plan
          if [ -n "$(git status --porcelain frontend/test/fixtures docs/images)" ]; then
            git status --porcelain frontend/test/fixtures docs/images
            echo '::error::Example plan is out of date. Run `pnpm example-plan` and commit it.'
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Built frontend is committed
        run: |
          if [ -n "$(git status --porcelain custom_components/chartroom/frontend)" ]; then
            git status --porcelain custom_components/chartroom/frontend
            echo '::error::custom_components/chartroom/frontend is out of date. Run `pnpm build` and commit it.'
            exit 1
          fi

      - name: Bundle size budget
        run: pnpm size

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --group lint --no-install-project

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format github .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Tests (pytest-homeassistant-custom-component)
        run: uv run --no-sync pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The HACS action can only validate public repositories. Until the repository goes public
      # at release this job only records that; afterwards validation runs with no change here.
      - name: Repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" = true ]; then
            echo '::notice::Repository is private; HACS validation is skipped until it is public.'
          fi

      - name: HACS validation
        if: steps.repo.outputs.private == 'false'
        uses: hacs/action@22.5.0
        with:
          category: integration
          comment: false
          # Brand assets go to home-assistant/brands at release (Phase 6).
          ignore: brands

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Start Home Assistant with Chartroom
        run: |
          mkdir -p .ci/ha-config/custom_components
          cp .ci/configuration.yaml .ci/ha-config/
          cp -r custom_components/chartroom .ci/ha-config/custom_components/
          docker run -d --name ha -p 127.0.0.1:8123:8123 -e TZ=Europe/Copenhagen \
            -v "$PWD/.ci/ha-config:/config" \
            "ghcr.io/home-assistant/home-assistant:${HA_VERSION}"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests
        run: pnpm e2e
        env:
          HA_URL: http://127.0.0.1:8123

      - name: Home Assistant log
        if: always()
        run: docker logs ha 2>&1 | tail -200

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single required status check for the main ruleset (mirrors captains-chest/floor-planner).
  ci:
    name: CI
    if: always()
    needs: [frontend, python, hassfest, hacs, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
