<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffc24b"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#36c6d6"/>
    </linearGradient>
    <linearGradient id="mild" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd36b"/><stop offset="1" stop-color="#c6e25a"/>
    </linearGradient>
  </defs>
  <!-- rooms: the colour stops at the walls -->
  <rect x="24" y="24" width="270" height="464" fill="url(#warm)"/>
  <rect x="294" y="24" width="194" height="232" fill="url(#cool)"/>
  <rect x="294" y="256" width="194" height="232" fill="url(#mild)"/>
  <!-- walls -->
  <g fill="none" stroke="#e8eefc" stroke-width="40" stroke-linecap="butt" stroke-linejoin="round">
    <rect x="20" y="20" width="472" height="472" rx="28"/>
    <path d="M294 24 V150 M294 250 V488 M294 256 H360 M430 256 H488"/>
  </g>
  <!-- sensors -->
  <g fill="#fff" stroke="#e8eefc" stroke-width="12">
    <circle cx="160" cy="200" r="30"/>
    <circle cx="392" cy="140" r="24"/>
  </g>
</svg>
