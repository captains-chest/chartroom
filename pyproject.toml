[project]
name = "chartroom"
version = "0.1.0"
description = "Chartroom: a floor plan view for Home Assistant"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.373",
  # panel_custom depends on frontend, which needs the frontend package (pinned by HA core).
  "home-assistant-frontend==20260930.4",
]
lint = ["ruff==0.17.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["node_modules", "custom_components/chartroom/frontend"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "FLY",
  "I",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TID",
  "UP",
  "W",
]
ignore = [
  "D203", # one-blank-line-before-class conflicts with D211
  "D213", # multi-line-summary-second-line conflicts with D212
  "PLR2004", # magic values in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.chartroom"]
combine-as-imports = true
